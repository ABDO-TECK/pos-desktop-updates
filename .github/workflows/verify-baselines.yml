name: Validate baseline lookup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: main
          persist-credentials: false
      - name: Exercise actual publisher lookup for baseline and delta inventories
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-Content scripts/build-delta-release.ps1 -Raw
          $start=$source.IndexOf('    $inventoryReleaseTag =')
          $end=$source.IndexOf('    if ($LASTEXITCODE) { throw ''Baseline release', $start)
          if($start -lt 0 -or $end -le $start){throw 'Publisher lookup block missing'}
          $lookup=$source.Substring($start,$end-$start)
          foreach($baselineTag in @('v0.0.8','v0.0.9')){
            $work=Join-Path $env:RUNNER_TEMP "lookup-$baselineTag"
            New-Item -ItemType Directory -Path $work | Out-Null
            Invoke-Expression $lookup
            if($LASTEXITCODE){throw 'Actual publisher download failed'}
            $inventory=Get-Content (Join-Path $work 'deployment-inventory.json') -Raw | ConvertFrom-Json
            if($inventory.version -ne $baselineTag.Substring(1)){throw 'Wrong baseline inventory'}
            if($baselineTag -eq 'v0.0.8' -and $inventoryReleaseTag -ne 'baseline-v0.0.8'){throw 'Build baseline was not selected'}
            if($baselineTag -eq 'v0.0.9' -and $inventoryReleaseTag -ne 'v0.0.9'){throw 'Ordinary delta inventory fallback failed'}
            Write-Host "Verified $inventoryReleaseTag inventory $($inventory.version)"
          }
