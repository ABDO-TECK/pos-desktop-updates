name: Validate baseline lookup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: main
          persist-credentials: false
      - name: Verify the current complete Setup baseline for future updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $source=Get-Content scripts/build-delta-release.ps1 -Raw
          $start=$source.IndexOf('    $baselineInventoryUrl =')
          $end=$source.IndexOf('    if ($LASTEXITCODE) { throw ''Baseline release', $start)
          if($start -lt 0 -or $end -le $start){throw 'Publisher lookup block missing'}
          $lookup=$source.Substring($start,$end-$start)
          $expectedHashes=@{'v0.0.1'='dc8f213aa3cbd2659529eb6cd8b0d298c9138e74d4b9142e42a52c774a27f488'}
          foreach($baselineTag in @('v0.0.1')){
            $work=Join-Path $env:RUNNER_TEMP "lookup-$baselineTag"
            New-Item -ItemType Directory -Path $work | Out-Null
            Invoke-Expression $lookup
            if($LASTEXITCODE){throw 'Actual publisher download failed'}
            $inventory=Get-Content (Join-Path $work 'deployment-inventory.json') -Raw | ConvertFrom-Json
            if($inventory.version -ne $baselineTag.Substring(1)){throw 'Wrong baseline inventory'}
            if((Get-FileHash (Join-Path $work 'deployment-inventory.json') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHashes[$baselineTag]){throw 'Baseline bytes differ from verified deployment inventory'}
            Write-Host "Verified $baselineTag inventory $($inventory.version)"
          }
