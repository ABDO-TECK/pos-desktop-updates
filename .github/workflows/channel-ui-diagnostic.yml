name: Isolated signed-package UI diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
      artifact_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, gd, mbstring, zip, openssl, phar
          coverage: none
      - name: Prepare test tooling only
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'Test tooling failed.' }
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress
          if ($LASTEXITCODE) { throw 'PHP test tooling failed.' }
      - uses: actions/download-artifact@v4
        with:
          name: channel-transition-debug-packages
          path: release-assets
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Prepare original isolated Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-channel-transition-ui.ps1 -Phase contract
      - name: Diagnose exact already-signed candidate without rebuilding or publishing
        shell: pwsh
        env:
          POS_TRANSITION_SCHEMA_EVIDENCE: '1'
        run: ./scripts/prepare-channel-transition-ui.ps1 -Phase acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-ui-diagnostic
          path: |
            ${{ runner.temp }}/channel-transition-ui-evidence
            ${{ runner.temp }}/transition-metadata-fixture/schema-*.json
          retention-days: 14
          if-no-files-found: ignore
