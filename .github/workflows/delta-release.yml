name: Signed delta release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source tag or commit in ABDO-TECK/pos-desktop
        required: true
      tag:
        description: Existing delta tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
      publish:
        description: Publish verified assets (otherwise validation only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: delta-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
  build:
    needs: metadata
    if: needs.metadata.outputs.mode == 'delta'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mysqli, gd, mbstring, dom, xml, xmlwriter, zip, openssl, phar, sqlite3
          coverage: none
      - name: Build and verify application artifacts
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run frontend:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:phar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-phar-runtime.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-asset-download.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-fleet-history.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-rollback-catalog.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-rollback-flow.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-duplicate-release-entries.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-delta-download-failure.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-asset-download-https.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-repair.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-update-execution-budget.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-http-timeout.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-notifications.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-release-channels.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-channel-policy.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-delta-flow.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify channel transition policy, signatures and service boundaries
        if: inputs.tag == 'v0.0.10-beta.5'
        shell: pwsh
        run: |
          php scripts/verify-active-channels.php
          if ($LASTEXITCODE) { throw 'Active channel verification failed.' }
          php scripts/verify-transition-catalog.php
          if ($LASTEXITCODE) { throw 'Transition catalog verification failed.' }
          php scripts/verify-transition-manifest.php
          if ($LASTEXITCODE) { throw 'Transition authority verification failed.' }
          node scripts/verify-channel-transition-flow.mjs
          if ($LASTEXITCODE) { throw 'Transition service verification failed.' }
          node scripts/verify-transition-publication.mjs
          if ($LASTEXITCODE) { throw 'Transition publication policy failed.' }
      - name: Prepare an ephemeral local candidate tag for validation only
        if: inputs.tag == 'v0.0.10-beta.5' && !inputs.publish
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$env:CANDIDATE_TAG" 2>$null
          if ($LASTEXITCODE) {
            git tag $env:CANDIDATE_TAG HEAD
            if ($LASTEXITCODE) { throw 'Cannot mark detached validation candidate.' }
          }
      - name: Generate and verify signed packages for every supported baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: ./scripts/build-delta-release.ps1 -Tag $env:RELEASE_TAG -Channel $env:RELEASE_CHANNEL
      - name: Measure data compatibility using the original Setup on an isolated runner
        if: inputs.tag == 'v0.0.10-beta.5'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-channel-transition-ui.ps1 -Phase contract
      - name: Sign changed-only and complete return bundles carried on beta
        if: inputs.tag == 'v0.0.10-beta.5'
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          $lab=Join-Path $env:RUNNER_TEMP 'channel-transition-ui-lab'
          php scripts/build-channel-transition.php "--target-root=$lab/app/resources/app.asar.unpacked" "--shell-root=$lab/app" "--target-inventory=$lab/deployment-inventory.json" "--contract=$lab/data-contract.json" --output=release-assets
          if ($LASTEXITCODE) { throw 'Transition signing or byte verification failed.' }
      - name: Verify both channel directions and delta/full return through the real Setup UI
        if: inputs.tag == 'v0.0.10-beta.5'
        shell: pwsh
        run: |
          ./scripts/prepare-channel-transition-ui.ps1 -Phase acceptance
          if ($LASTEXITCODE) { throw 'Actual channel UI acceptance failed.' }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/channel-transition-ui-evidence/acceptance.json" -Destination 'release-assets/channel-transition-acceptance.json'
      - uses: actions/upload-artifact@v4
        if: always() && inputs.tag == 'v0.0.10-beta.5'
        with:
          name: channel-transition-ui-evidence
          path: ${{ runner.temp }}/channel-transition-ui-evidence
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.tag == 'v0.0.10-beta.5'
        with:
          name: channel-transition-debug-packages
          path: release-assets/*
          if-no-files-found: ignore
          retention-days: 3
      - name: Build signed one-time repair and verify real installed baselines
        if: inputs.tag == 'v0.0.10-beta.2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          php scripts/build-update-repair.php release-assets
          if ($LASTEXITCODE) { throw 'Repair tool signing failed.' }
          $env:UPDATE_PRIVATE_KEY = ''
          ./scripts/verify-signed-update-repair.ps1 -Assets release-assets
          if ($LASTEXITCODE) { throw 'Signed repair acceptance failed.' }
      - name: Checkout acceptance-only rendered-control wait correction
        if: inputs.tag == 'v0.0.10-beta.4'
        uses: actions/checkout@v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: a00dd84dda56ef50d0bd9880cd0eb24802c88ed7
          path: rollback-acceptance-source
          persist-credentials: false
          sparse-checkout: scripts/verify-rollback-ui.mjs
          sparse-checkout-cone-mode: false
      - name: Verify update and rollback through the real original Setup UI
        if: inputs.tag == 'v0.0.10-beta.4'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath 'rollback-acceptance-source/scripts/verify-rollback-ui.mjs' -Destination 'scripts/verify-rollback-ui.mjs'
          ./scripts/prepare-rollback-ui.ps1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.tag == 'v0.0.10-beta.4'
        with:
          name: rollback-ui-evidence
          path: ${{ runner.temp }}/rollback-ui-evidence
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: signed-delta
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: [metadata, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-delta
          path: release-assets
      - name: Publish signed assets on the updates repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          mv release-assets/release-notes.md release-notes.md
          gh release create "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" --title "POS Desktop $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"

