name: Signed delta release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed POS Desktop beta source commit SHA
        required: true
      tag:
        description: Beta release tag
        required: true
        default: v0.0.15-beta.1
      publish:
        description: Publish the already verified artifact from a stage run
        type: boolean
        default: false
      stage_run_id:
        description: Successful stage run ID for publish mode
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: beta-0.0.15-release
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_ref }}
  BETA_TAG: ${{ inputs.tag }}
  STAGED_WORKFLOW_SHA: 584e568ee082ecb48c4d89d7464424e9e9366241

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify beta and staging inputs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ABDO-TECK/pos-desktop-updates' ]]
          [[ "$GITHUB_REF" == 'refs/heads/codex/beta-0.0.15-release' ]]
          [[ "$BETA_TAG" == 'v0.0.15-beta.1' ]]
          [[ "$SOURCE_SHA" == '1cade27190cc7ed81456a86a174fc6f35f46ae62' ]]
          if [[ "$PUBLISH" == true ]]; then
            [[ "$STAGE_RUN_ID" == 45983874931 ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" |
              jq -e --arg sha "$STAGED_WORKFLOW_SHA" \
                '.path == ".github/workflows/delta-release.yml" and .head_branch == "codex/beta-0.0.15-release" and
                 .head_sha == $sha and .event == "workflow_dispatch" and .conclusion == "success" and
                 .head_repository.full_name == "ABDO-TECK/pos-desktop-updates"'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID/jobs" |
              jq -e '[.jobs[] | select(.name == "Build, sign, and verify on Windows" and .conclusion == "success")] | length == 1'
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15190857768" |
              jq -e --arg sha "$STAGED_WORKFLOW_SHA" \
                '.name == "beta15-signed-release" and .workflow_run.id == 45983874931 and
                 .workflow_run.head_sha == $sha and .expired == false and
                 .digest == "sha256:a4fc05988d1143e2d99754c660a075daec291b94452c6ce4908b12138d2b0e76"'
          else
            [[ -z "$STAGE_RUN_ID" ]]
          fi

  stage:
    name: Build, sign, and verify on Windows
    needs: guard
    if: '!inputs.publish'
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/frontend/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mysqli, gd, mbstring, dom, xml, xmlwriter, zip, openssl, phar, sqlite3, curl
          coverage: none
      - name: Build the exact merged application payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm --prefix frontend ci
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress
          npm --prefix frontend run typecheck
          npm run frontend:build
          npm run build:phar
          php scripts/verify-phar-runtime.php
          php scripts/verify-release-channels.php
          node scripts/verify-update-channel-policy.cjs
          php scripts/verify-transition-manifest.php
          php scripts/verify-channel-transition-builder.php
          node scripts/verify-channel-transition-flow.mjs
          node scripts/verify-transition-receipt-http.mjs
          php scripts/verify-shell-release-delivery.php
          node scripts/verify-admin-update-ui.mjs
      - name: Verify the published Setup and compare the actual MariaDB contracts
        run: ../tooling/scripts/stage-beta15.ps1 -Phase Prepare
      - name: Sign exact 0.0.14 and beta application inventories and packages
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: ../tooling/scripts/stage-beta15.ps1 -Phase Sign
      - name: Freeze the signed release asset digests
        run: node ../tooling/scripts/verify-beta15-release.mjs freeze release-assets $env:GITHUB_RUN_ID
      - name: Verify the signed release in the installed Setup 0.0.14 UI
        run: ./scripts/verify-beta15-channel-ui.ps1 -Mode staged -ReleaseAssets release-assets
      - name: Verify the accepted bytes match the signed stage
        run: node ../tooling/scripts/verify-beta15-release.mjs verify release-assets $env:GITHUB_RUN_ID
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta15-signed-release
          path: source/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: beta15-staged-evidence
          path: |
            ${{ runner.temp }}/setup14-shell/evidence
            ${{ runner.temp }}/shell-release-a44773e9675841a3be53781c0c4d2ffa/evidence
            ${{ runner.temp }}/beta15-channel-staged/evidence
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: guard
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta15-signed-release
          repository: ABDO-TECK/pos-desktop-updates
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Publish the exact accepted beta and verify every public asset
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
        run: node scripts/verify-beta15-release.mjs publish release-assets "$STAGE_RUN_ID" public-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta15-public-checksums
          path: public-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  live:
    name: Verify the real public beta in Setup 0.0.14
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ABDO-TECK/pos-desktop
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mysqli, zip, openssl, phar, sqlite3, curl
          coverage: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta15-public-checksums
          path: public-checksums
      - name: Verify published checksums and prepare signed public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download $env:BETA_TAG --repo ABDO-TECK/pos-desktop-updates --pattern '*' --dir release-assets
          $publicChecksum = (Get-FileHash -LiteralPath 'release-assets/SHA256SUMS.txt').Hash
          $acceptedChecksum = (Get-FileHash -LiteralPath '../public-checksums/SHA256SUMS.txt').Hash
          if ($publicChecksum -cne $acceptedChecksum) { throw 'Public checksum file changed.' }
          foreach ($record in Get-Content -LiteralPath 'release-assets/SHA256SUMS.txt') {
            if ($record -cnotmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum record.' }
            $hash = (Get-FileHash -LiteralPath (Join-Path 'release-assets' $Matches[2])).Hash.ToLowerInvariant()
            if ($hash -cne $Matches[1]) { throw 'Public asset differs from the accepted bytes.' }
          }
      - name: Exercise the public beta transition through the installed Update Center
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress
          ./scripts/verify-setup13-shell-baseline.ps1 -BinaryAcceptance
          ./scripts/verify-beta15-channel-ui.ps1 -Mode live -ReleaseAssets release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: beta15-public-evidence
          path: ${{ runner.temp }}/beta15-channel-live/evidence
          if-no-files-found: warn
          retention-days: 14
